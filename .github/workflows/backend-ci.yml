name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, Backend]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      JWT_ACCESS_SECRET: this-is-a-long-access-secret-for-ci
      JWT_REFRESH_SECRET: this-is-a-long-refresh-secret-for-ci
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      CORS_ORIGIN: http://localhost:3000
      SUPER_ADMIN_EMAIL: superadmin@example.com
      SUPER_ADMIN_PASSWORD: SuperSecurePassword123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --include=optional
          # Work around npm optional-dependency omission seen in CI for Rollup native bindings.
          npm ls @rollup/rollup-linux-x64-gnu >/dev/null 2>&1 || npm i --no-save @rollup/rollup-linux-x64-gnu

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Run unit tests
        run: npm run test:unit
