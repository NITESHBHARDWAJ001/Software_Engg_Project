openapi: 3.0.3
info:
  title: Ethnic Fashion SaaS Backend API
  version: 1.1.0
  description: Complete API contract for backend routes under /api/v1.
servers:
  - url: http://localhost:4000
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Organizations
  - name: Customers
  - name: Inventory
  - name: Finance
  - name: Tasks
  - name: Exhibitions
  - name: Employees
  - name: Notifications
  - name: Subscriptions
  - name: Analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OkResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          nullable: true
      required:
        - success
    PagedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 20
            total:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 3
          required:
            - page
            - pageSize
            - total
            - totalPages
      required:
        - success
        - data
        - pagination
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
      required:
        - success
        - code
        - message
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    RegisterRequest:
      type: object
      properties:
        organizationName:
          type: string
        adminName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - organizationName
        - adminName
        - email
        - password
    CustomerCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        city:
          type: string
        country:
          type: string
      required:
        - name
    CustomerStatusUpdate:
      type: object
      properties:
        isArchived:
          type: boolean
      required:
        - isArchived
    InventoryCreate:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        currentStock:
          type: integer
          minimum: 0
        reorderLevel:
          type: integer
          minimum: 0
        minStockLevel:
          type: integer
          minimum: 0
        unitPrice:
          type: number
          minimum: 0
        sellingPrice:
          type: number
          minimum: 0
        unit:
          type: string
      required:
        - name
        - sku
        - category
        - unitPrice
        - sellingPrice
    StockAdjustment:
      type: object
      properties:
        quantity:
          type: integer
        changeType:
          type: string
          enum: [IN, OUT, ADJUSTMENT]
        note:
          type: string
      required:
        - quantity
        - changeType
    NotificationCreate:
      type: object
      properties:
        userId:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
        link:
          type: string
      required:
        - userId
        - title
        - message
        - type
    GenericObject:
      type: object
      additionalProperties: true

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        '200':
          description: Service is alive

  /health/ready:
