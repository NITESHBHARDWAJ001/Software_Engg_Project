openapi: 3.0.3
info:
  title: Ethnic Fashion SaaS Backend API
  version: 1.0.0
  description: Multi-tenant backend API with JWT auth, RBAC, and subscription feature controls.
servers:
  - url: http://localhost:4000
    description: Local
tags:
  - name: Health
  - name: Auth
  - name: Organizations
  - name: Customers
  - name: Inventory
  - name: Finance
  - name: Tasks
  - name: Exhibitions
  - name: Subscriptions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OkResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data: {}
      required:
        - success
        - data
    PagedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 20
            total:
              type: integer
              example: 145
            totalPages:
              type: integer
              example: 8
          required:
            - page
            - pageSize
            - total
            - totalPages
      required:
        - success
        - data
        - pagination
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
      required:
        - success
        - code
        - message
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 20
      required:
        - refreshToken
    CustomerCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 5
        city:
          type: string
        country:
          type: string
      required:
        - name
    InventoryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        sku:
          type: string
          minLength: 2
        category:
          type: string
          minLength: 2
        currentStock:
          type: integer
          minimum: 0
        reorderLevel:
          type: integer
          minimum: 0
        minStockLevel:
          type: integer
          minimum: 0
        unitPrice:
          type: number
          minimum: 0
        sellingPrice:
          type: number
          minimum: 0
        unit:
          type: string
          default: piece
      required:
        - name
        - sku
        - category
        - unitPrice
        - sellingPrice
    StockAdjustment:
      type: object
      properties:
        quantity:
          type: integer
        changeType:
          type: string
          enum:
            - IN
            - OUT
            - ADJUSTMENT
        note:
          type: string
      required:
        - quantity
        - changeType
    InvoiceCreate:
      type: object
      properties:
        invoiceNumber:
          type: string
          minLength: 2
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        currency:
          type: string
          minLength: 3
          maxLength: 3
        subtotal:
          type: number
          minimum: 0
        taxAmount:
          type: number
          minimum: 0
        discountAmount:
          type: number
          minimum: 0
        totalAmount:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 2000
      required:
        - invoiceNumber
        - issueDate
        - subtotal
        - totalAmount
    TaskCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 2
        description:
          type: string
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - REVIEW
            - COMPLETED
            - CANCELLED
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
        assignedTo:
          type: string
        dueDate:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: string
        relatedExhibitionId:
          type: string
        relatedCustomerId:
          type: string
      required:
        - title
    ExhibitionCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
        location:
          type: string
          minLength: 2
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - UPCOMING
            - ACTIVE
            - COMPLETED
            - CANCELLED
        budget:
          type: number
          minimum: 0
        actualSpent:
          type: number
          minimum: 0
        expectedRevenue:
          type: number
          minimum: 0
        actualRevenue:
          type: number
          minimum: 0
        expectedFootfall:
          type: integer
          minimum: 0
        actualFootfall:
          type: integer
          minimum: 0
        boothSize:
          type: string
        stallNumber:
          type: string
        category:
          type: string
        assignedStaff:
          type: array
          items:
            type: string
        notes:
          type: string
        images:
          type: array
          items:
            type: string
      required:
        - name
        - location
        - startDate
        - endDate
    PlanCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        code:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 2000
        billingCycle:
          type: string
          enum:
            - MONTHLY
            - QUARTERLY
            - YEARLY
        price:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        isActive:
          type: boolean
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
      required:
        - name
        - code
        - billingCycle
        - price
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      responses:
        "200":
          description: Service is alive
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      responses:
        "200":
          description: Service is ready
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Refresh token invalid/revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke refresh token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logged out
  /api/v1/organizations/me:
    get:
      tags:
        - Organizations
      summary: Get current organization profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/v1/customers:
    get:
      tags:
        - Customers
      summary: List customers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponse"
    post:
      tags:
        - Customers
      summary: Create customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/v1/customers/stats:
    get:
      tags:
        - Customers
      summary: Customer analytics overview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer stats
  /api/v1/customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer found
    patch:
      tags:
        - Customers
      summary: Update customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "200":
          description: Customer updated
    delete:
      tags:
        - Customers
      summary: Archive customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer archived
  /api/v1/inventory:
    get:
      tags:
        - Inventory
      summary: List inventory items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paged inventory list
    post:
      tags:
        - Inventory
      summary: Create inventory item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCreate"
      responses:
        "201":
          description: Inventory item created
  /api/v1/inventory/stats:
    get:
      tags:
        - Inventory
      summary: Inventory stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
  /api/v1/inventory/alerts/low-stock:
    get:
      tags:
        - Inventory
      summary: Low-stock alerts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Alert list
  /api/v1/inventory/analytics/categories:
    get:
      tags:
        - Inventory
      summary: Category analytics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Category metrics
  /api/v1/inventory/{id}:
    get:
      tags:
        - Inventory
      summary: Get inventory item by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found
    patch:
      tags:
        - Inventory
      summary: Update inventory item
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCreate"
      responses:
        "200":
          description: Updated
  /api/v1/inventory/{id}/adjust-stock:
    post:
      tags:
        - Inventory
      summary: Adjust stock quantity
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustment"
      responses:
        "200":
          description: Stock updated
  /api/v1/inventory/{id}/movements:
    get:
      tags:
        - Inventory
      summary: Inventory movement history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Movement list
  /api/v1/finance/invoices:
    get:
      tags:
        - Finance
      summary: List invoices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paged invoices
    post:
      tags:
        - Finance
      summary: Create invoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
      responses:
        "201":
          description: Invoice created
  /api/v1/finance/invoices/{id}:
    get:
      tags:
        - Finance
      summary: Get invoice by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice
    patch:
      tags:
        - Finance
      summary: Update invoice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
      responses:
        "200":
          description: Updated
  /api/v1/finance/invoices/{id}/status:
    patch:
      tags:
        - Finance
      summary: Update invoice status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status updated
  /api/v1/finance/ledger:
    get:
      tags:
        - Finance
      summary: List ledger entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paged ledger entries
    post:
      tags:
        - Finance
      summary: Create ledger entry
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Ledger entry created
  /api/v1/finance/analytics/cash-flow:
    get:
      tags:
        - Finance
      summary: Cash-flow summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cash-flow
  /api/v1/finance/analytics/trends:
    get:
      tags:
        - Finance
      summary: Revenue/expense trends
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Trends
  /api/v1/finance/analytics/stats:
    get:
      tags:
        - Finance
      summary: Finance stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Finance KPIs
  /api/v1/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paged tasks
    post:
      tags:
        - Tasks
      summary: Create task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created
  /api/v1/tasks/stats:
    get:
      tags:
        - Tasks
      summary: Task stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task KPIs
  /api/v1/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task
    patch:
      tags:
        - Tasks
      summary: Update task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "200":
          description: Task updated
    delete:
      tags:
        - Tasks
      summary: Delete task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task deleted
  /api/v1/tasks/{id}/status:
    patch:
      tags:
        - Tasks
      summary: Update task status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status updated
  /api/v1/tasks/{id}/comments:
    get:
      tags:
        - Tasks
      summary: List task comments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment list
    post:
      tags:
        - Tasks
      summary: Add task comment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Comment added
  /api/v1/exhibitions:
    get:
      tags:
        - Exhibitions
      summary: List exhibitions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paged exhibitions
    post:
      tags:
        - Exhibitions
      summary: Create exhibition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExhibitionCreate"
      responses:
        "201":
          description: Exhibition created
  /api/v1/exhibitions/stats:
    get:
      tags:
        - Exhibitions
      summary: Exhibition stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Exhibition KPIs
  /api/v1/exhibitions/{id}:
    get:
      tags:
        - Exhibitions
      summary: Get exhibition by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exhibition
    patch:
      tags:
        - Exhibitions
      summary: Update exhibition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExhibitionCreate"
      responses:
        "200":
          description: Updated
  /api/v1/exhibitions/{id}/leads:
    get:
      tags:
        - Exhibitions
      summary: List exhibition leads
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead list
    post:
      tags:
        - Exhibitions
      summary: Create exhibition lead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Lead created
  /api/v1/exhibitions/{id}/leads/{leadId}:
    patch:
      tags:
        - Exhibitions
      summary: Update exhibition lead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: leadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead updated
  /api/v1/exhibitions/leads/{leadId}/interactions:
    post:
      tags:
        - Exhibitions
      summary: Add lead interaction
      security:
        - bearerAuth: []
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Interaction added
  /api/v1/exhibitions/{id}/roi:
    get:
      tags:
        - Exhibitions
      summary: Get exhibition ROI
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ROI summary
  /api/v1/subscriptions/plans:
    get:
      tags:
        - Subscriptions
      summary: List subscription plans
      security:
        - bearerAuth: []
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plan list
    post:
      tags:
        - Subscriptions
      summary: Create subscription plan (SUPER_ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreate"
      responses:
        "201":
          description: Plan created
  /api/v1/subscriptions/plans/{planId}:
    patch:
      tags:
        - Subscriptions
      summary: Update subscription plan
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreate"
      responses:
        "200":
          description: Plan updated
    delete:
      tags:
        - Subscriptions
      summary: Deactivate subscription plan
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan deactivated
  /api/v1/subscriptions/organizations/{organizationId}/current:
    get:
      tags:
        - Subscriptions
      summary: Get organization current subscription
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current subscription
    put:
      tags:
        - Subscriptions
      summary: Assign plan to organization
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Assigned
    patch:
      tags:
        - Subscriptions
      summary: Update organization current subscription
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
  /api/v1/subscriptions/organizations/{organizationId}/current/cancel:
    post:
