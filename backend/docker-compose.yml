version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ccse_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ethnic_saas
    ports:
      - '5432:5432'
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ethnic_saas']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccse_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ethnic_saas?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-change-me
      JWT_REFRESH_SECRET: change-me-refresh-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      CORS_ORIGIN: http://localhost:5173
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: ChangeThisStrongPassword123!
      ANALYTICS_SERVICE_URL: http://host.docker.internal:8000/api/v1
      ANALYTICS_ORG_SYNC_INTERVAL_MS: 86400000
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health/live || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  backend_postgres_data:
